name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER_PRODUCTION }}
          port: ${{ secrets.SSH_PORT_PRODUCTION }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            TARGET_DIR="$HOME/apps/uranai-app"
            PREV_SHA="$(cd "$TARGET_DIR" 2>/dev/null && git rev-parse HEAD 2>/dev/null || true)"

            echo "[DEBUG] target_dir=$TARGET_DIR"
            echo "[DEBUG] branch=main"
            echo "[DEBUG] docker=$(docker --version 2>&1)"
            echo "[DEBUG] compose=$(docker compose version 2>&1)"

            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/mandyryu999/uranai-app.git"
              git fetch origin main
              git checkout -B main origin/main
            else
              mkdir -p "$(dirname "$TARGET_DIR")"
              rm -rf "$TARGET_DIR"
              git clone --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/mandyryu999/uranai-app.git" "$TARGET_DIR"
              cd "$TARGET_DIR"
            fi

            echo "[DEBUG] git HEAD: $(git rev-parse --short HEAD)"
            echo "[DEPLOY] building web image..."
            WEB_PORT=8080 docker compose build --pull --no-cache web

            echo "[DEPLOY] starting services..."
            WEB_PORT=8080 docker compose up -d --force-recreate --remove-orphans
            WEB_PORT=8080 docker compose ps

            echo "[DEPLOY] health check: http://127.0.0.1:8080/health"
            HC="000"
            for i in 1 2 3 4 5 6 7 8; do
              sleep 5
              HC="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/health || true)"
              HC="${HC:-000}"
              echo "[DEPLOY] try $i: HTTP $HC"
              case "$HC" in
                2*|3*) break ;;
              esac
            done

            case "$HC" in
              2*|3*)
                echo "[DEPLOY] OK (HTTP $HC)"
                ;;
              *)
                echo "[DEPLOY] NG (HTTP $HC)"
                echo "[DEPLOY] compose status:"
                WEB_PORT=8080 docker compose ps || true
                echo "[DEPLOY] web logs:"
                WEB_PORT=8080 docker compose logs --no-color --tail=200 web || true
                echo "[DEPLOY] db logs:"
                WEB_PORT=8080 docker compose logs --no-color --tail=100 db || true

                if [ -n "$PREV_SHA" ]; then
                  echo "[DEPLOY] rolling back to $PREV_SHA"
                  git checkout -B main "$PREV_SHA"
                  WEB_PORT=8080 docker compose up -d --force-recreate --build --remove-orphans
                else
                  echo "[DEPLOY] first deployment: no rollback target"
                fi
                exit 1
                ;;
            esac
